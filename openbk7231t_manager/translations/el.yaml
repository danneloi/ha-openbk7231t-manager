configuration:
  scan_subnet:
    name: Σαρωμένο υποδίκτυο
    description: >-
      Υποδίκτυο CIDR προς σάρωση για συσκευές (π.χ. 192.168.1.0/24). Αφήστε
      κενό για αυτόματο εντοπισμό του υποδικτύου της διεπαφής δικτύου του
      πρόσθετου.
  poll_interval_minutes:
    name: Διάστημα ελέγχου (λεπτά)
    description: Πόσο συχνά ελέγχονται οι γνωστές συσκευές για κατάσταση και έκδοση υλικολογισμικού.
  release_check_interval_hours:
    name: Διάστημα ελέγχου εκδόσεων (ώρες)
    description: Πόσο συχνά το πρόσθετο ελέγχει το GitHub για νέες εκδόσεις του OpenBK7231T_App.
  notify_on_update:
    name: Ειδοποίηση κατά την ενημέρωση
    description: Στέλνει μόνιμη ειδοποίηση Home Assistant όταν είναι διαθέσιμη νέα έκδοση υλικολογισμικού.
  firmware_server_port:
    name: Θύρα διακομιστή υλικολογισμικού
    description: >-
      Τοπική θύρα που χρησιμοποιεί το πρόσθετο για την παροχή αρχείων
      υλικολογισμικού στις συσκευές κατά τη διάρκεια ενημέρωσης OTA. Πρέπει να
      είναι προσβάσιμη από τις συσκευές IoT σας.
  log_level:
    name: Επίπεδο καταγραφής
    description: Επίπεδο λεπτομέρειας της εξόδου καταγραφής του πρόσθετου.
