configuration:
  scan_subnet:
    name: Сканирана подмрежа
    description: >-
      CIDR подмрежа за търсене на устройства (напр. 192.168.1.0/24). Оставете
      празно за автоматично откриване на подмрежата на мрежовия интерфейс на
      добавката.
  poll_interval_minutes:
    name: Интервал на запитване (минути)
    description: Колко често известните устройства се проверяват за статус и версия на фърмуера.
  release_check_interval_hours:
    name: Интервал на проверка за версии (часове)
    description: Колко често добавката проверява GitHub за нови версии на OpenBK7231T_App.
  notify_on_update:
    name: Уведомяване при актуализация
    description: Изпраща постоянно известие на Home Assistant, когато е налична нова версия на фърмуера.
  firmware_server_port:
    name: Порт на сървъра за фърмуер
    description: >-
      Локален порт, който добавката използва за обслужване на файлове с
      фърмуер на устройствата по време на OTA актуализация. Трябва да бъде
      достъпен от вашите IoT устройства.
  log_level:
    name: Ниво на логовете
    description: Подробност на изходните логове на добавката.
